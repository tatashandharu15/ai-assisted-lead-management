<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dedupe Candidates · AI Lead Manager</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <main>
    <div class="page-head">
      <h1 class="page-title">🔍 Duplicate Lead Groups
        <span class="backend-hint" id="backend-hint"></span>
      </h1>
      <p class="page-desc">2-stage dedup pipeline: 3-key blocking → weighted fuzzy scoring (name/company/email + phone boost 1.1×) → connected components DSU/DFS.</p>
    </div>
    <div class="panel">
      <div class="slider-row">
        <label style="color:var(--text-dim);font-size:12.5px;min-width:140px"><strong>Min Confidence Threshold</strong></label>
        <input type="range" id="slider" min="0.3" max="1" step="0.05" value="0.7" oninput="document.getElementById('val').textContent = (+this.value).toFixed(2) + '  (' + Math.round(+this.value * 100) + '%)'" />
        <span class="slider-val" id="val">0.70  (70%)</span>
        <label style="color:var(--text-dim);font-size:12.5px;margin-left:12px">Max groups</label>
        <select class="select" id="limit">
          <option value="20">Top 20</option><option value="50" selected>Top 50</option>
          <option value="100">Top 100</option><option value="500">All (up to 500)</option>
        </select>
        <button class="btn primary" onclick="runDedup()">🔍 Run Dedupe</button>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--text-dim)">
        <span>Presets:</span>
        <button class="btn" onclick="setPreset(1.00)">Phone Exact (1.00 · strictest)</button>
        <button class="btn" onclick="setPreset(0.85)">High (0.85)</button>
        <button class="btn" onclick="setPreset(0.70)">Default (0.70)</button>
        <button class="btn" onclick="setPreset(0.50)">Broad (0.50 · catch all 136 flagged)</button>
      </div>
    </div>
    <div class="stats-grid" id="summaryCards" style="display:none"></div>
    <div class="panel">
      <div class="panel-head">
        <h3 class="panel-title">Candidate Duplicate Groups</h3>
        <div class="panel-sub" id="groupCount"></div>
      </div>
      <div id="results">
        <div class="empty"><div class="ico">☝️</div><div class="t">Click "Run Dedupe"</div><div class="s">Starts with default threshold 0.7; adjust slider for strictness</div></div>
      </div>
    </div>
  </main>
  <script src="../js/api.js"></script>
  <script>
    function initHint() {
      const b = getCurrentBackend();
      document.getElementById('backend-hint').innerHTML = `Backend: <span class="active-col mono" style="color:${b.color}">${b.label} :${b.port}</span>`;
    }
    function setPreset(v) { document.getElementById('slider').value = v; document.getElementById('val').textContent = v.toFixed(2) + '  (' + Math.round(v * 100) + '%)'; runDedup(); }

    async function runDedup() {
      initHint();
      const conf = +document.getElementById('slider').value;
      const lim = +document.getElementById('limit').value;
      document.getElementById('results').innerHTML = `<div class="empty"><div class="ico">⏳</div><div class="t">Running dedup pipeline...</div><div class="s">Blocking → fuzzy scoring → connected components (2049 leads)</div></div>`;
      document.getElementById('summaryCards').style.display = 'none';
      try {
        const groups = await api('/leads/dedupe-candidates', { method: 'POST', body: { minConfidence: conf, limit: lim } });
        renderGroups(groups || [], conf);
      } catch (e) { showToast(e.message, '#ef4444'); }
    }

    function renderGroups(groups, conf) {
      if (!groups.length) {
        document.getElementById('results').innerHTML = `<div class="empty"><div class="ico">✅</div><div class="t">No duplicates at threshold ${conf}</div><div class="s">Lower the slider for broader matches.</div></div>`;
        document.getElementById('groupCount').textContent = '0 groups';
        return;
      }
      const totalGroups = groups.length;
      const sumLeads = groups.reduce((s, g) => s + (g.lead_ids?.length ?? g.leadIds?.length ?? 0), 0);
      const avgConf = groups.reduce((s, g) => s + (+g.confidence || 0), 0) / totalGroups;
      const sizeHist = { '2': 0, '3': 0, '4': 0, '5+': 0 };
      groups.forEach(g => {
        const sz = g.lead_ids?.length ?? g.leadIds?.length ?? 0;
        if (sz >= 5) sizeHist['5+']++;
        else sizeHist[String(sz)]++;
      });
      document.getElementById('summaryCards').style.display = 'grid';
      document.getElementById('summaryCards').innerHTML = `
        <div class="stat-card" style="--stat-color:#6366f1"><div class="stat-label">Groups Found</div><div class="stat-value">${totalGroups}</div><div class="stat-sub">threshold ≥ ${(conf * 100).toFixed(0)}%</div></div>
        <div class="stat-card" style="--stat-color:#10b981"><div class="stat-label">Leads Covered</div><div class="stat-value">${sumLeads}</div><div class="stat-sub">of 2049 total (${(sumLeads / 2049 * 100).toFixed(1)}%)</div></div>
        <div class="stat-card" style="--stat-color:#f59e0b"><div class="stat-label">Avg Confidence</div><div class="stat-value">${(avgConf * 100).toFixed(1)}%</div><div class="stat-sub">Max ${(Math.max(...groups.map(g => +g.confidence || 0)) * 100).toFixed(1)}%</div></div>
        <div class="stat-card" style="--stat-color:#ec4899"><div class="stat-label">Pairs (size 2)</div><div class="stat-value">${sizeHist['2'] || 0}</div><div class="stat-sub">simple duplicates</div></div>
        <div class="stat-card" style="--stat-color:#8b5cf6"><div class="stat-label">Triples (size 3)</div><div class="stat-value">${sizeHist['3'] || 0}</div><div class="stat-sub">3-way overlaps</div></div>
        <div class="stat-card" style="--stat-color:#ef4444"><div class="stat-label">Clusters ≥ 4</div><div class="stat-value">${(sizeHist['4'] || 0) + sizeHist['5+']}</div><div class="stat-sub">complex merge candidates</div></div>
      `;
      document.getElementById('groupCount').textContent = `${totalGroups} groups · ${sumLeads} leads · avg conf ${(avgConf * 100).toFixed(1)}%`;

      const rows = groups.map((g, i) => {
        const ids = g.lead_ids ?? g.leadIds ?? [];
        const confPct = (+g.confidence || 0) * 100;
        const cls = confPct >= 90 ? 'conf-high' : (confPct >= 70 ? 'conf-med' : 'conf-low');
        const preview = g.leads_preview ?? g.leadsPreview ?? [];
        return `<details class="exp" ${i < 3 ? 'open' : ''}>
          <summary style="display:grid;grid-template-columns:60px 80px 1fr 200px 120px;gap:14px;align-items:center;padding:10px 14px;cursor:pointer;user-select:none">
            <div class="mono" style="color:var(--text-muted)">#${i + 1}</div>
            <div><span class="badge" style="background:var(--panel-2)">×${ids.length}</span></div>
            <div style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              <span class="mono" style="color:var(--text-dim)">IDs </span>
              ${ids.slice(0, 6).map(id => `<strong>#${escapeHtml(String(id))}</strong>`).join(' · ')}${ids.length > 6 ? ` <span style="color:var(--text-muted)">+${ids.length - 6} more</span>` : ''}
            </div>
            <div>
              <div class="prog ${cls}"><div class="fill" style="width:${confPct.toFixed(1)}%"></div></div>
            </div>
            <div class="mono" style="font-weight:700;letter-spacing:-0.01em">${confPct.toFixed(0)}%</div>
          </summary>
          <div style="padding:2px 14px 10px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start">
            <div>
              <div style="font-size:12px;color:var(--text-dim);margin:6px 0 8px;font-weight:500">Explanation</div>
              <div class="notes-box" style="margin-top:0;background:var(--bg)">${escapeHtml(g.explanation || '(n/a)')}</div>
            </div>
            <div style="min-width:200px;text-align:right">
              <div style="font-size:12px;color:var(--text-dim);margin:6px 0 8px;font-weight:500">Quick Actions</div>
              <button class="btn" onclick="showToast('Open lead merge dialog — next step feature', '#6366f1')">🔗 Merge Group →</button>
            </div>
          </div>
          <div class="preview-grid">
            ${preview.map(p => {
              const nm = p.name || p.full_name || p.fullName || [p.first_name || p.firstName, p.last_name || p.lastName].filter(Boolean).join(' ') || '—';
              const em = p.email || '—';
              const comp = p.company || p.company_name || p.companyName || '—';
              return `<div class="preview-card">
                <div class="pn">${escapeHtml(nm)}</div>
                <div class="pe">${escapeHtml(em)}</div>
                <div class="pc">${escapeHtml(comp)}</div>
              </div>`;
            }).join('')}
          </div>
        </details>`;
      }).join('');
      document.getElementById('results').innerHTML = `<div class="table-wrap"><table class="data" style="border-collapse:separate;border-spacing:0"><tbody>
        ${rows}
      </tbody></table></div>`;
      showToast(`Found ${totalGroups} dup groups (${sumLeads} leads covered)`, '#10b981');
    }
    renderHeader('dedup');
    initHint();
    onBackendSwitch(runDedup);
    window.reloadPageData = runDedup;
    setTimeout(runDedup, 400);
  </script>
</body>
</html>
